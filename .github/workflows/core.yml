name: core

# pingduck-core (C++) on every platform it ships on. The agent has its own
# workflow (agent.yml). Third-party actions are pinned to commit SHAs; the
# comment names the release, and Dependabot keeps both current.

on:
  push:
    branches: [main]
    paths: ["core/**", "packages/pingduck_core/**", ".github/workflows/core.yml"]
  pull_request:
    paths: ["core/**", "packages/pingduck_core/**", ".github/workflows/core.yml"]
  # Weekly, so fuzzing and the Apple builds still run while core is quiet.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S core -B build -A x64
      - run: cmake --build build --config Release
      # The "network" label needs a real LAN; runners do not have one.
      - run: ctest --test-dir build -C Release -LE network --output-on-failure

  linux:
    name: Linux (GCC, libpcap)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release -DPINGDUCK_PCAP=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE network --output-on-failure
      - name: ARP scan smoke test (raw libpcap path)
        # Only the gateway's /30, so the runner's network sees four frames.
        run: |
          gw=$(ip route | awk '/^default/ {print $3; exit}')
          sudo timeout 60 ./build/pingduck_cli arp "$gw/30" --json | tee arp.jsonl
          grep -q "\"ip\":\"$gw\"" arp.jsonl

  sanitizers:
    name: Linux (Clang, ASan + UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - run: >
          cmake -S core -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          -DPINGDUCK_SANITIZE=address,undefined
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE network --output-on-failure

  fuzz:
    name: Fuzz (libFuzzer, 2 min per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S core -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++ -DPINGDUCK_BUILD_FUZZERS=ON
      - run: cmake --build build -j
      # The corpus carries over between runs so coverage keeps growing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run fuzzers
        run: |
          set -e
          for t in dns mdns ssdp misc; do
            dict=""
            case $t in dns|mdns) dict=-dict=core/fuzz/dict/dns.dict ;; ssdp) dict=-dict=core/fuzz/dict/ssdp.dict ;; esac
            mkdir -p corpus/$t crashes
            ./build/fuzz/fuzz_$t $dict -max_total_time=120 -max_len=9000 -timeout=5 \
              -artifact_prefix=crashes/$t- corpus/$t
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: crashes/

  android:
    name: Android NDK (${{ matrix.abi }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: >
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-24 -DPINGDUCK_BUILD_TESTS=ON
      - run: cmake --build build

  macos:
    name: macOS (Clang)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build -j
      - run: ctest --test-dir build -LE network --output-on-failure

  ios:
    name: iOS xcframework
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash core/scripts/build-xcframework.sh build-ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PingDuckCore.xcframework
          path: build-ios/PingDuckCore.xcframework

  # The one check a branch rule requires: fails if any job above failed.
  ci:
    name: core ci
    if: always()
    needs: [windows, linux, sanitizers, fuzz, android, macos, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
