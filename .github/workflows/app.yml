name: app

# The Flutter app: analyzer and unit/widget tests. The unit tests use fakes
# (test/fakes.dart), so no native core build is needed here. The signed
# Android build for Play internal testing arrives with Phase 3 of
# .claude/plans/ci-cd-overhaul.md.

on:
  push:
    branches: [main]
    paths: ["pingduck_app/**", "packages/pingduck_core/**", "tools/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["pingduck_app/**", "packages/pingduck_core/**", "tools/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: App (analyze, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pingduck_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  ci:
    name: app ci
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
