name: app

# The Flutter app: analyzer and unit/widget tests, plus an unsigned debug
# APK so plugin or Gradle bumps that break the Android build fail here. The
# unit tests use fakes (test/fakes.dart); the APK build compiles the native
# core through the NDK. The signed Android build for Play internal testing
# arrives with Phase 3 of .claude/plans/ci-cd-overhaul.md.

on:
  push:
    branches: [main]
    paths: ["pingduck_app/**", "packages/pingduck_core/**", "tools/**", ".github/workflows/app.yml"]
  # Every PR, so "app ci" always reports; the changes job skips the
  # real work when none of the paths above changed.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: app changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.match == 'true' }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            match:
              - 'pingduck_app/**'
              - 'packages/pingduck_core/**'
              - 'tools/**'
              - '.github/workflows/app.yml'

  test:
    name: App (analyze, test)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pingduck_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: App (Android debug build)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pingduck_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug

  ci:
    name: app ci
    if: always()
    needs: [changes, test, android]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
