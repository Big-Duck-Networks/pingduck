name: ios

# Keeps the iOS app compiling until the TestFlight lane exists (it needs an
# Apple Developer account). Unsigned, so nothing is distributed.

on:
  schedule:
    - cron: "0 7 * * 1"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: iOS (unsigned build)
    # On PRs only when labelled "apple": a full iOS build takes ~20 minutes.
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'apple')
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: pingduck_app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
