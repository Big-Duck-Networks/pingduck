# Generates lib/src/bindings.g.dart from the core's public C header.
#
#   dart run ffigen --config ffigen.yaml
#
# Needs libclang. Without a system LLVM, `pip install libclang` (in a venv)
# provides one; point ffigen at it with an extra `llvm-path:` entry.
name: PingDuckBindings
description: Bindings for core/include/pingduck/pingduck.h. Regenerate, do not edit.
output: lib/src/bindings.g.dart
headers:
  entry-points:
    - ../../core/include/pingduck/pingduck.h
  include-directives:
    - ../../core/include/pingduck/pingduck.h
functions:
  include:
    - pd_.*
  symbol-address:
    include:
      - pd_forward_copy
structs:
  include:
    - pd_.*
typedefs:
  include:
    - pd_.*
macros:
  include:
    - PD_.*
preamble: |
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
